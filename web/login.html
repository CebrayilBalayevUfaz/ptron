<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puppetron – Sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-6v2h3v2H7v-2h3v-2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v9h16V6H4z"/></svg>
    <h1>Puppetron</h1>
    <p class="muted">KVM / libvirt virtual machine manager</p>
  </div>
  <form id="login-form" autocomplete="on">
    <label>Username
      <input name="username" id="username" type="text" required autofocus autocomplete="username">
    </label>
    <label>Password
      <input name="password" id="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn primary wide" id="login-btn">Sign in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</main>
<script>
(function () {
  const form = document.getElementById('login-form');
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'puppetron' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      const next = new URLSearchParams(location.search).get('next');
      location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/';
    } catch (ex) {
      err.textContent = ex.message;
      err.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
